[project]
name = "truck-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "pydantic>=2.11",
    "structlog>=25.4",
    "httpx>=0.28",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
