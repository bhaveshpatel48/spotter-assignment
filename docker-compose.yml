# Runs the production images locally: http://localhost:8080 (app) and http://localhost:8000 (API).
# Values come from the root .env (see .env.example).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:?Set TOMTOM_API_KEY in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-local-secret-key}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      LOG_FORMAT: json

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_TOMTOM_MAP_KEY: ${VITE_TOMTOM_MAP_KEY:?Set VITE_TOMTOM_MAP_KEY in .env}
    ports:
      - "8080:80"
    depends_on:
      - backend
